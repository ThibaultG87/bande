<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Câblage pas à pas</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eef2f5}
/* même page que l'aperçu « tablette » du module Bandes de NovaBAT, en plein écran */
.ph-scr{position:relative;height:100%;overflow:auto;border-radius:28px;background:#eef2f5;color:#14222e;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:12px 12px 26px;color-scheme:light}
.ph-scr small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#5a6b78}
.ph-hd{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:#fff;border:1px solid #d4dde4;border-radius:12px;padding:10px 12px}.ph-hd .r{text-align:right}.ph-hd b{display:block;font-size:16px}
.ph-faces{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13.5px;margin:10px 2px}.ph-faces b{display:inline-block;min-width:18px;text-align:center;background:#14222e;color:#fff;border-radius:4px;margin-right:4px}
.ph-go{display:block;width:100%;margin:8px 0;padding:14px 12px;border:0;border-radius:12px;background:#0e6ba8;color:#fff;font:700 18px/1.2 inherit;cursor:pointer}.ph-go small{color:#fff;opacity:.9;text-transform:none;letter-spacing:0;font-size:13px;margin-top:3px}
.ph-sch{position:relative}.ph-svg{background:#fff;border:1px solid #d4dde4;border-radius:12px;overflow:hidden}.ph-svg svg{display:block;width:100%;height:auto}.ph-svg [data-n]{cursor:pointer;transition:opacity .15s}
.ph-cn{position:absolute;right:6px;top:6px;background:#fff;border:1px solid #d4dde4;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);padding:6px 8px;line-height:0}.ph-cn svg{display:block}.ph-cn .cn-alone{line-height:1.2;font-size:13px;font-weight:600;color:#b9791a}
.ph-info{background:#fff;border:1px solid #d4dde4;border-radius:12px;padding:10px 12px;margin-top:8px}
.ph-l{margin:6px 0 0;padding:0;list-style:none;font-size:14.5px;display:grid;gap:6px}.ph-l i{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid rgba(0,0,0,.25)}
.ph-bague{display:inline-block;min-width:30px;text-align:center;background:#FFD400;border:1.5px solid #111;border-radius:10px;font-weight:800;padding:0 7px}
.ph-bch{display:inline-block;color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:2px 9px}
.ph-rest h3{font-size:16px;margin:16px 0 8px}
.ph-steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}.ph-steps>li{background:#fff;border:1px solid #d4dde4;border-radius:10px;padding:10px 12px}.ph-steps>li.done{opacity:.55}
.ph-steps label{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.ph-steps input{width:22px;height:22px;accent-color:#1d8a4b}.ph-steps label small{flex-basis:100%;margin-left:28px;text-transform:none;letter-spacing:0;font-size:13px}
.ph-sn{display:inline-flex;min-width:24px;height:24px;align-items:center;justify-content:center;border-radius:6px;background:#14222e;color:#fff;font-size:13px;padding:0 5px}
.ph-scr.pp>*:not(.ph-sch):not(.ph-top):not(.ph-nav):not(.ph-end){display:none}.ph-scr.pp .ph-hint{display:none}.ph-scr.pp{padding:0 0 92px}
.ph-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid #d4dde4;padding:10px 10px 12px;overflow:hidden}
.ph-n{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;border-radius:9px;background:#14222e;color:#fff;font-size:21px}
.ph-lab{flex:1;font-weight:700;font-size:15.5px;line-height:1.2;min-width:0}.ph-cnt{color:#5a6b78;font-size:14px;white-space:nowrap}
.ph-x{font-size:18px;padding:6px 12px;border-radius:8px;border:1px solid #d4dde4;background:transparent;color:inherit;cursor:pointer}
.ph-bar{position:absolute;left:0;bottom:0;height:4px;background:#1d8a4b;width:0;transition:width .2s}
.ph-scr.pp .ph-sch{padding:8px}
.ph-nav{position:sticky;bottom:0;z-index:3;display:grid;grid-template-columns:1fr 1.4fr;gap:8px;padding:10px;background:#fff;border-top:1px solid #d4dde4;margin-top:8px}
.ph-scr.pp .ph-nav{position:absolute;left:0;right:0;bottom:0;position:sticky}
.ph-nav button{padding:16px 10px;border-radius:12px;border:1px solid #d4dde4;background:#eef2f5;color:inherit;font:700 18px/1 inherit;cursor:pointer}.ph-nav .ph-next{background:#1d8a4b;border-color:#1d8a4b;color:#fff}.ph-nav button:disabled{opacity:.4}
.ph-end{position:absolute;inset:0;z-index:4;background:rgba(10,20,30,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.ph-end>div{background:#fff;border-radius:16px;padding:22px 18px;text-align:center;width:100%}.ph-end b{display:inline-flex;width:64px;height:64px;border-radius:50%;background:#1d8a4b;color:#fff;font-size:36px;align-items:center;justify-content:center}
.ph-end h2{font-size:21px;margin:12px 0 6px}.ph-end p{margin:4px 0}.ph-end button{display:block;width:100%;margin-top:10px;padding:13px;border-radius:10px;border:1px solid #d4dde4;background:#eef2f5;color:inherit;font:600 16px inherit;cursor:pointer}.ph-end .ph-fin{background:#0e6ba8;border-color:#0e6ba8;color:#fff}
.ph-aff{display:grid;gap:1px;margin:2px 2px 10px}.ph-aff b{font-size:17px}.ph-aff span{font-size:13.5px;color:#5a6b78}
.ph-scr{border-radius:0;min-height:100%;height:100%;padding:max(12px,env(safe-area-inset-top,0px)) 12px 26px}
.ph-scr.pp{padding:0 0 92px}
.ph-msg{max-width:520px;margin:18vh auto 0;padding:0 20px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#14222e;text-align:center}.ph-msg b{display:block;font-size:21px;margin-bottom:8px}
#app{max-width:640px;margin:0 auto;height:100%}
.cn-only{line-height:0}
.fn{color:#5a6b78;font-size:13px}
</style>
</head>
<body>
<div id="app"><div class="ph-msg"><b>Câblage pas à pas</b>Lecture de la boîte…</div></div>
<script type="module" src="page.js"></script>
</body>
</html>
